
<div class="login-form"></div>
 <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your account to continue</p>

      <form #loginForm="ngForm" (submit)="onSubmit()">
        <div class="form-group">
            <div class="form-row">
                <label for="Username">Username</label>
                <input class="form-control" placeholder="Enter Username" type="text" required minlength="4"  name="Username" [(ngModel)]="user.username" >
                <div *ngIf="loginForm.submitted && loginForm.controls['Username']?.errors" class="error-message" style="color: red;">Please enter a valid Username</div>
            </div>
        </div>
        <div class="form-group">
                <div class="form-row">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        name="password"
                        [(ngModel)]="user.password"
                        required
                        
                        placeholder="Enter your password"
                        class="form-control"
                    />
                </div>
                <div *ngIf="loginForm.submitted && loginForm.controls['password']?.errors" class="error-message" style="color: red;">
            Password must be at least 6 characters long
          </div>
        </div>
        <div class="form-group">
            <button class="btn btn-primary" type="submit">Submit</button>
        </div>
      </form>
